<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03152e"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#03152e;color:#f7f9ff;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}a{color:inherit;text-decoration:none}.top{padding:18px 5%;border-bottom:2px solid #e8b34f;background:linear-gradient(110deg,#03152c,#061e3b);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:700 28px "Cormorant Garamond",serif;direction:ltr}.brand span{color:#e8b34f}.ar{font:700 22px Amiri,serif}.wrap{max-width:820px;margin:38px auto;padding:0 18px}.panel{background:linear-gradient(145deg,#09294a,#041a34);border:1px solid #e8b34f;border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 12px 32px #0004}.title{font:700 36px Amiri,serif;margin:0 0 10px}.muted{color:#cbd6e5;line-height:1.9}.gold{color:#ffda86}.field{display:grid;gap:7px;margin:15px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #c9d8ec;background:#f8fbff;color:#182a42;font:inherit}.button{display:inline-block;background:linear-gradient(120deg,#ffe092,#d99b32);color:#17253c;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}.outline{display:inline-block;border:1px solid #e8b34f;border-radius:10px;padding:11px 16px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.status{display:none;margin-top:15px;border:1px solid #e8b34f;border-radius:10px;padding:12px;color:#ffe0a0;line-height:1.8}.status.show{display:block}footer{margin-top:34px;border-top:1px solid #e8b34f;padding:20px;text-align:center;color:#cbd6e5;font-size:13px}@media(max-width:520px){.top{align-items:flex-start;flex-direction:column}.title{font-size:30px}} </style><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><title>إنشاء حساب | SAKAN EUROPE</title></head><body><header class="top"><a href="index.html"><div class="brand">SAKAN <span>EUROPE</span></div><div class="ar">سكن أوروبا</div></a><a class="outline" href="index.html">الرئيسية</a></header><main class="wrap"><section class="panel"><h1 class="title">أنشئ حسابك في سكن أوروبا</h1><p class="muted">اختر نوع الحساب المناسب لاحتياجاتك العقارية.</p><form id="signup"><label class="field">الاسم الكامل<input autocomplete="name" required maxlength="120"></label><label class="field">البريد الإلكتروني<input type="email" autocomplete="email" required maxlength="254"></label><label class="field">نوع الحساب<select required><option value="">اختر نوع الحساب</option><option>باحث عن عقار للشراء</option><option>باحث عن عقار للإيجار</option><option>مالك عقار</option><option>وكيل أو شركة عقارية</option></select></label><label class="field">كلمة المرور التجريبية<input type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label><label class="field"><span><input type="checkbox" required style="width:auto"> أوافق على مراجعة <a class="gold" href="terms.html">الشروط والأحكام</a> و<a class="gold" href="privacy.html">سياسة الخصوصية</a>.</span></label><button class="button" type="submit">متابعة التسجيل</button></form><div class="status" id="status" role="status"></div><p class="muted">تنبيه: التسجيل الفعلي لم يُفعّل بعد. لا تدخل كلمة مرور حقيقية في هذه النسخة التجريبية.</p></section></main><footer>© 2026 SAKAN EUROPE — سكن أوروبا</footer><script>document.getElementById('signup').addEventListener('submit',e=>{e.preventDefault();const s=document.getElementById('status');s.textContent='تم التحقق من الحقول محليًا فقط. لم يُنشأ حساب لأن خدمة التسجيل وقاعدة البيانات لم تُربطا بعد.';s.classList.add('show')})</script></body></html>
