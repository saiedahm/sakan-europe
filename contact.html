*{box-sizing:border-box}body{margin:0;background:#03152e;color:#f7f9ff;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}.top,footer{padding:20px 5%;background:linear-gradient(110deg,#03152c,#061e3b);border-bottom:2px solid #e8b34f}.brand{font:700 28px "Cormorant Garamond",serif;direction:ltr}.brand span{color:#e8b34f}.ar{font:700 22px Amiri,serif}a{color:inherit;text-decoration:none}.wrap{max-width:760px;margin:40px auto;padding:0 20px}.panel{background:#082448;border:1px solid #e8b34f;border-radius:18px;padding:28px}.title{font:700 36px Amiri,serif;margin:0}.muted{color:#cbd6e5;line-height:1.8}label{display:block;margin:16px 0 7px;font-size:14px}input,textarea,select{width:100%;padding:12px;border-radius:9px;border:1px solid #c9d8ec;background:#f8fbff;color:#182a42;font:inherit}textarea{min-height:130px;resize:vertical}button{background:linear-gradient(120deg,#ffe092,#d99b32);border:0;border-radius:10px;padding:13px 22px;font-weight:bold;margin-top:18px;cursor:pointer}.status{display:none;border:1px solid #e8b34f;border-radius:10px;padding:12px;margin-top:14px;color:#ffe0a0}.status.show{display:block}footer{text-align:center;border-top:1px solid #e8b34f;border-bottom:0;color:#cbd6e5;font-size:13px;margin-top:35px}

.site-logo{width:64px;height:64px;flex:0 0 64px;display:block;object-fit:cover;aspect-ratio:1/1;border-radius:50%;border:2px solid #e8b34f;box-shadow:0 0 0 2px #03152c,0 0 12px #d9a84980}

</style><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header class="top"><a href="index.html"><img src="sakan-europe-logo.png" alt="SAKAN EUROPE — سكن أوروبا" class="site-logo"><div class="brand">SAKAN <span>EUROPE</span></div><div class="ar">سكن أوروبا</div></a></header><main class="wrap"><section class="panel"><h1 class="title">اتصل بنا</h1><p class="muted">يسعدنا استقبال استفساراتك حول منصة سكن أوروبا. نموذج الرسالة هنا واجهة فقط؛ لم يتم ربطه بخدمة إرسال بريد بعد.</p><form id="contact"><label for="name">الاسم</label><input id="name" required maxlength="100" autocomplete="name"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required maxlength="254" autocomplete="email"><label for="topic">موضوع الرسالة</label><select id="topic"><option>استفسار عام</option><option>إعلان عقاري</option><option>الدعم الفني</option><option>اقتراح</option></select><label for="message">الرسالة</label><textarea id="message" required maxlength="4000"></textarea><button type="submit">مراجعة الرسالة</button></form><div class="status" id="status" role="status"></div></section></main><footer><img src="sakan-europe-logo.png" alt="SAKAN EUROPE — سكن أوروبا" class="footer-logo"><a href="privacy.html">سياسة الخصوصية</a>　|　<a href="terms.html">الشروط والأحكام</a><br>© 2026 SAKAN EUROPE — سكن أوروبا<div style="margin-top:8px"><a href="impressum.html" style="color:#ffda86">الإشعار القانوني</a></div></footer><script>document.getElementById('contact').addEventListener('submit',e=>{e.preventDefault();const s=document.getElementById('status');s.textContent='تم التحقق من الحقول في المتصفح. لم تُرسل الرسالة لأن خدمة البريد لم تُربط بعد.';s.classList.add('show')})</script><script src="i18n.js" defer></script>
